# The CI of the public repository oscaraccountant/oscaraccountant-php. It is
# exported from the private source repository of Oscar: a change made here
# is overwritten by the next export.
#
# A tag v<version> is a release: Packagist reads it. The job `tag` checks
# that the tag equals OscarAccountant\Version::VERSION.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest PHP the SDK supports, to the newest release.
        php: ['8.2', '8.3', '8.4', '8.5']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: vendor/bin/php-cs-fixer check
      - run: vendor/bin/phpstan analyse --no-progress
      # Unit tests; the conformance cases and the mock server suite are in the source repository.
      - run: vendor/bin/phpunit --coverage-clover build/clover.xml
      - run: php tests/check-coverage.php build/clover.xml 90

  tag:
    name: tag equals the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none
      - name: The tag is v<Version::VERSION>
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(php -r 'require "src/Version.php"; echo OscarAccountant\Version::VERSION;')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not v$version (src/Version.php)."
            exit 1
          fi
